- name: Deploy Minecraft Server on EC2
  hosts: all
  become: yes

  vars:
    minecraft_dir: /home/ec2-user/minecraft

  tasks:

    - name: Install Java
      dnf:
        name: java-21-amazon-corretto
        state: present

    - name: Create minecraft directory
      ansible.builtin.file:
        path: "{{ minecraft_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user

    - name: Download Minecraft server jar
      ansible.builtin.get_url:
        url: https://piston-data.mojang.com/v1/objects/145ff0858209bcfc164859ba735d4199aafa1eea/server.jar
        dest: "{{ minecraft_dir }}/minecraft_server.jar"
        mode: '0755'


    - name: Accept EULA
      ansible.builtin.copy:
        dest: "{{ minecraft_dir }}/eula.txt"
        content: "eula=true\n"

    - name: Install Minecraft systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/minecraft.service
        mode: '0644'
        content: |
          [Unit]
          Description=Minecraft Server
          After=network.target

          [Service]
          User=ec2-user
          WorkingDirectory=/home/ec2-user/minecraft
          ExecStart=/usr/bin/java -Xms1G -Xmx1G -jar minecraft_server.jar nogui
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Enable Minecraft service
      ansible.builtin.systemd:
        name: minecraft
        enabled: yes

    - name: Start Minecraft service
      ansible.builtin.systemd:
        name: minecraft
        state: started
